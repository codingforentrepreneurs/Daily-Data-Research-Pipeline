name: Daily Hacker News

on:
  workflow_dispatch:
    inputs:
      hn_lookback:
        description: Hacker News story window
        required: true
        default: today
        type: choice
        options:
          - today
          - 1d
          - 7d
          - 14d
          - 30d
          - 90d
          - 356d
          - 365d
          - 2yrs
  # schedule:
    # Runs every day at 06:00 UTC
    # - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  hacker-news:
    runs-on: ubuntu-latest
    env:
      GHOST_API_KEY: ${{ secrets.GHOST_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHOST_NAME: ${{ vars.GHOST_NAME || 'daily-research' }}
      HN_LOOKBACK: ${{ inputs.hn_lookback || 'today' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ghost CLI
        run: |
          curl -fsSL https://install.ghost.build | sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq postgresql-client

      - name: Ensure Ghost database
        run: |
          DB_ID=$(ghost list --json | jq -r --arg name "$GHOST_NAME" '.[] | select(.name == $name) | .id' | head -1)
          if [ -z "$DB_ID" ]; then
            ghost create --name "$GHOST_NAME" --wait
            DB_ID=$(ghost list --json | jq -r --arg name "$GHOST_NAME" '.[] | select(.name == $name) | .id' | head -1)
          fi
          if [ -z "$DB_ID" ]; then
            echo "Could not find or create Ghost database: $GHOST_NAME"
            exit 1
          fi
          echo "DB_ID: $DB_ID"

      - name: Install wb
        run: |
          curl -fsSL https://get.workbooks.dev | sh

      - name: Run hacker-news runbook
        run: |
          echo "HN_LOOKBACK=$HN_LOOKBACK"
          wb run runbooks/4-hacker-news.md --bail
