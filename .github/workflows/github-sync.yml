name: My GitHub Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          GHOST_API_KEY: ${{ secrets.GHOST_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN || secrets.GH_TOKEN }}
        run: |
          missing=()
          [ -z "${GHOST_API_KEY:-}" ] && missing+=("GHOST_API_KEY")
          [ -z "${GH_TOKEN:-}" ]        && missing+=("GH_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Skipping GitHub sync because missing secret(s): ${missing[*]}"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  my-github-sync:
    needs: preflight
    if: needs.preflight.outputs.ok == 'true'
    runs-on: ubuntu-latest
    env:
      GHOST_API_KEY: ${{ secrets.GHOST_API_KEY }}
      # Use a user PAT here. The default Actions GITHUB_TOKEN is an integration
      # token and cannot access user-scoped endpoints like /user/starred.
      GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN || secrets.GH_TOKEN }}
      GHOST_NAME: ${{ vars.GHOST_NAME || 'daily-research' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ghost CLI
        run: |
          curl -fsSL https://install.ghost.build | sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq postgresql-client

      - name: Ensure Ghost database
        run: |
          DB_ID=$(ghost list --json | jq -r --arg name "$GHOST_NAME" '.[] | select(.name == $name) | .id' | head -1)
          if [ -z "$DB_ID" ]; then
            ghost create --name "$GHOST_NAME" --wait
            DB_ID=$(ghost list --json | jq -r --arg name "$GHOST_NAME" '.[] | select(.name == $name) | .id' | head -1)
          fi
          if [ -z "$DB_ID" ]; then
            echo "Could not find or create Ghost database: $GHOST_NAME"
            exit 1
          fi
          echo "DB_ID: $DB_ID"

      - name: Install wb
        run: |
          curl -fsSL https://get.workbooks.dev | sh

      - name: Run top-repos runbook
        run: |
          wb run runbooks/1-github.md --bail
